# Central platform stack (IP-04): Angular + Nginx, ASP.NET Core Backend, SQL Server, and a
# one-shot EF Core migration job.
#
#   docker compose up --build -d
#
# The Jetson Agent is deliberately NOT here. It runs natively on the Jetson under systemd (T-41)
# because it needs NVIDIA, DeepStream, camera, and subprocess access.
#
# Only the frontend publishes a host port. The browser and the Jetson both reach the Backend
# through the frontend's Nginx reverse proxy on that single origin, so SQL Server and the Backend
# stay on the internal network with no host exposure.
#
# No `version:` key — it is obsolete in the current Compose specification.

name: weapon-detection

services:
  # --- SQL Server -----------------------------------------------------------------------------
  sqlserver:
    # Pinned to an explicit CU tag rather than a floating `2022-latest`, so a rebuild months from
    # now gets the same database engine.
    image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required - run deployment/start.ps1 or copy .env.example to .env}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433" # Only for local debugging; the Backend never connects to localhost. The Jetson Agent never connects to localhost. The browser never connects to localhost. In production, this port is firewalled off.
    volumes:
      # Named volume, not a bind mount: the database survives `docker compose down` and is removed
      # only by an explicit `down -v` (deployment/reset.ps1).
      - sqlserver-data:/var/opt/mssql
    networks:
      - internal
    # No `ports:` — SQL Server is never reachable from the host or the LAN.
    healthcheck:
      # sqlcmd path verified against this image: only /opt/mssql-tools18/bin/sqlcmd exists (the
      # older /opt/mssql-tools is absent). Tools 18 default to encrypted connections, so -C
      # (trust the self-signed certificate) is required. Running a real query proves the engine
      # accepts connections, rather than merely proving the process is alive.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # SQL Server's first start initialises system databases and is genuinely slow; the grace
      # period stops those early attempts from counting as failures.
      start_period: 60s
    restart: unless-stopped

  # --- EF Core migrations (one-shot) ----------------------------------------------------------
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
    environment:
      # The Backend's existing design-time seam (WeaponDetectionDbContextFactory). Supplied through
      # the environment, never as a command-line argument, so no credential lands in a process list.
      EFCORE_DESIGNTIME_CONNECTION: Server=sqlserver,1433;Database=${SQL_DATABASE:-WeaponDetection};User Id=sa;Password=${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required};TrustServerCertificate=True;Encrypt=True
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - internal
    # A one-shot job: it applies migrations, exits 0, and stays exited. Never restart it.
    restart: "no"

  # --- Backend API ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # `sqlserver,1433` is the Compose service name. It must not be localhost/127.0.0.1 — inside
      # this container, localhost is the Backend itself.
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${SQL_DATABASE:-WeaponDetection};User Id=sa;Password=${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required};TrustServerCertificate=True;Encrypt=True
      # Issuer, Audience, and lifetime already ship in appsettings.json; only the signing key must
      # be supplied. JwtOptionsValidator requires >= 32 UTF-8 bytes and fails startup otherwise.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      # AdminBootstrapper provisions the single Admin account at startup and fails startup if these
      # are missing while no Admin exists.
      BootstrapAdmin__CredentialIdentifier: ${ADMIN_IDENTIFIER:-admin}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # FS-07: a named volume (below), not the container's writable layer, so the Data Protection
      # key ring — and therefore every already-protected Device secret — survives a full
      # `docker compose up -d`/`--force-recreate` of this container, not merely a process restart
      # within the same one. Mounted only into this service (Phase 5) — no other service ever
      # needs to unprotect a Device secret.
      DataProtection__KeyPath: /var/lib/weapon-detection/dataprotection-keys
      # FS-08 §8: a second, separate named volume (below) from dataprotection-keys — snapshot
      # evidence JPEGs are a distinct durability concern from the Data Protection key ring and must
      # survive a full `docker compose up -d`/`--force-recreate` of this container the same way.
      # Mounted only into this service — no other service ever reads/writes a snapshot file.
      AlertSnapshots__StoragePath: /var/lib/weapon-detection/alert-snapshots
      # FS-09 §11: Branch-level daily Alert quota (default 15/Branch/day). No volume needed — quota
      # state lives in SQL Server (BranchDailyAlertQuotas/SuppressedDetectionEvents), not the
      # filesystem. Set AlertQuota__Enabled=false to fully disable enforcement (IP-11 §4 Rollback).
      AlertQuota__Enabled: "true"
      # Operator-configurable via the protected .env (see .env.example). The literal default stays
      # 15 — the approved production policy — so an environment that never sets the variable keeps
      # exactly the previous behaviour. AlertQuotaOptionsValidator still bounds the effective value
      # to 1..10000 at startup, so a typo cannot silently disable the quota.
      AlertQuota__MaximumPerBranchPerDay: "${ALERT_QUOTA_MAXIMUM_PER_BRANCH_PER_DAY:-15}"
      # FS-14 §5, IP-16 T-8: the media gateway's internal control-API origin — reachable only
      # over this compose network, never published to the host.
      MediaGateway__BaseUrl: http://mediamtx:9997
    volumes:
      - dataprotection-keys:/var/lib/weapon-detection/dataprotection-keys
      - alert-snapshots:/var/lib/weapon-detection/alert-snapshots
    depends_on:
      # The Backend does not migrate on startup, and its Admin bootstrap needs an existing schema,
      # so it must not start until the migration job has succeeded.
      migrations:
        condition: service_completed_successfully
    networks:
      - internal
    # No `ports:` — the Backend is reached only through the Nginx proxy.
    restart: unless-stopped

  # --- Angular SPA + Nginx reverse proxy ------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      # The single public entry point for the browser and for the Jetson Agent.
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    # Receives no secrets: no SQL password, no JWT signing key, no Admin credential.
    restart: unless-stopped

  # --- Media gateway (MediaMTX) — FS-14 §5, IP-16 T-2 -----------------------------------------
  # Formalizes the instance that already ran in production as an ad hoc `docker run` container
  # (the Windows RTSP test-stream ingestion workflow, CLAUDE.md) into normal container management.
  # Pinned by the exact digest that instance was already running, so this is a management change,
  # not an upgrade. RTSP (8554) is published exactly as before; the control API (9997) and WHEP
  # HTTP signaling (8889) are reachable only on the internal network / proxied by frontend's Nginx
  # — never published directly. Only the WebRTC ICE/UDP media port needs direct host exposure,
  # since RTP media cannot pass through an HTTP reverse proxy the way the WHEP signaling can.
  mediamtx:
    image: bluenviron/mediamtx@sha256:f37aaaf1a707c42b0aff49a3ab5d4fa57a3504ebc3f27657434a820e3b16d730
    volumes:
      - ./deployment/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554" # RTSP — unchanged from the pre-existing ad hoc instance.
      - "8189:8189/udp" # WebRTC ICE/UDP media mux — must be host-reachable for browser playback.
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    # Pinned rather than Docker-assigned (FS-14 §5, IP-16 T-1/T-2): mediamtx.yml's
    # authInternalUsers restricts its control-API to this exact subnet, so it must not drift
    # across a network recreation the way an auto-assigned subnet could.
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  sqlserver-data:
  # FS-07: Data Protection key ring persistence for the Backend service only (mounted above).
  dataprotection-keys:
  # FS-08: Alert snapshot evidence storage for the Backend service only (mounted above) — a
  # separate volume from dataprotection-keys, never shared.
  alert-snapshots:
